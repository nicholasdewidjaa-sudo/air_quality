name: Mobile Responsiveness Check

on:
  push:
    branches: [main]
    paths:
      - '**/*.html'
      - '**/*.css'
      - '**/*.js'
      - '.lighthouserc.json'
      - '.github/workflows/mobile_responsive.yml'
  pull_request:
    paths:
      - '**/*.html'
      - '**/*.css'
      - '**/*.js'
      - '.lighthouserc.json'
      - '.github/workflows/mobile_responsive.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-responsiveness:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify Tailwind CSS is up to date
        run: |
          npm run build:css
          git diff --exit-code -- assets/tailwind.css

      - name: Run Lighthouse CI on mobile
        run: npx --yes @lhci/cli@0.16.1 autorun
        env:
          CHROME_PATH: /usr/bin/google-chrome
